[package]
name = "k0t1k-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "k0t1k_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
k0t1k-core.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
base64 = "0.23"
dirs = "7"
discord-rich-presence = "1.1"
chrono = "0.4"
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"

# Shortcuts (IShellLinkW) and waiting for the previous process to exit; already in Tauri's dependency tree.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
