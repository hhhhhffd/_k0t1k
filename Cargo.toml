[workspace]
resolver = "3"
members = ["packages/core", "apps/app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
k0t1k-core = { path = "packages/core" }
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
panic = "abort"
