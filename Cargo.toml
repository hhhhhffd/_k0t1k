[workspace]
resolver = "3"
members = ["packages/core", "apps/app/src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
k0t1k-core = { path = "packages/core" }
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
panic = "abort"

# Quick builds for trying the app out: no LTO and parallel codegen, so a rebuild takes about a minute
# instead of several. Releases keep the `release` profile.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 1
