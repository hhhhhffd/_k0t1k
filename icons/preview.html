  section.light { background: #f1eff7; color: #1c1730; }
  h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
  figure { margin: 0; padding: 12px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
           border-radius: 10px; background: #13101c; }
  .light figure { background: #ffffff; }
  img { width: 64px; height: 64px; }
  figcaption { font-size: 11px; opacity: .7; text-align: center; word-break: break-word; }
  .small img { width: 32px; height: 32px; }
</style>
